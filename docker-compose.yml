version: '3.8'

services:
  bot:
    build: .
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=telegram_uploader
      - MYSQL_USER=telegram_user
      - MYSQL_PASSWORD=changeme
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
